name: Ingest verified polls

on:
  workflow_dispatch:
    inputs:
      payload_base64:
        description: Base64-encoded verified poll-update JSON
        required: true
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: observer-poll-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Decode the verified update
        shell: bash
        env:
          PAYLOAD_BASE64: ${{ inputs.payload_base64 }}
        run: |
          set -euo pipefail
          printf '%s' "$PAYLOAD_BASE64" | base64 --decode > "$RUNNER_TEMP/poll-update.json"
          python3 -m json.tool "$RUNNER_TEMP/poll-update.json" >/dev/null
      - name: Validate and update both raw feeds
        run: >-
          python3 automation/ingest_poll_update.py
          --payload "$RUNNER_TEMP/poll-update.json"
      - name: Verify the complete feeds
        run: python3 automation/ingest_poll_update.py --check-only
      - name: Commit the atomic raw-data update
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          test -n "$changed"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(data/raw-polls\.json|data/polls\.json)$' || true)"
          test -z "$unexpected"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/raw-polls.json data/polls.json
          update_date="$(python3 -c 'import json,os; print(json.load(open(os.environ["RUNNER_TEMP"] + "/poll-update.json")).get("updateDate", "verified-update"))')"
          git commit -m "polls: verified update ${update_date}"
          git push origin HEAD:main
      - name: Trigger the full gated recalculation
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run recalculate.yml --ref main
