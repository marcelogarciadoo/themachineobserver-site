name: Ingest verified polls

on:
  workflow_dispatch:
    inputs:
      payload_base64:
        description: Base64-encoded verified poll-update JSON
        required: true
        type: string
  issues:
    types: [opened]

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: observer-poll-ingest
  cancel-in-progress: false

jobs:
  ingest:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
       github.event.issue.user.login == github.repository_owner &&
       (startsWith(github.event.issue.title, '[poll-ingest] ') ||
        startsWith(github.event.issue.title, '[poll-ingest-test] ')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Decode the verified update
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_PAYLOAD: ${{ inputs.payload_base64 }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            printf '%s' "$MANUAL_PAYLOAD" | base64 --decode > "$RUNNER_TEMP/poll-update.json"
          else
            python3 - <<'PY'
          import base64
          import binascii
          import os
          from pathlib import Path

          marker = "<!-- observer-poll-payload:v1 -->"
          body = os.environ.get("ISSUE_BODY", "")
          if not body.startswith(marker + "\n"):
              raise SystemExit("Issue body must start with the exact v1 payload marker")
          encoded = body[len(marker):].strip()
          if not encoded or len(encoded) > 60_000 or any(ch.isspace() for ch in encoded):
              raise SystemExit("Issue payload must be one non-empty base64 line of at most 60,000 characters")
          try:
              decoded = base64.b64decode(encoded, validate=True)
          except (ValueError, binascii.Error) as exc:
              raise SystemExit(f"Invalid base64 issue payload: {exc}") from exc
          if len(decoded) > 45_000:
              raise SystemExit("Decoded issue payload exceeds 45,000 bytes")
          Path(os.environ["RUNNER_TEMP"], "poll-update.json").write_bytes(decoded)
          PY
          fi
          python3 -m json.tool "$RUNNER_TEMP/poll-update.json" >/dev/null
      - name: Validate and update both raw feeds
        run: >-
          python3 automation/ingest_poll_update.py
          --payload "$RUNNER_TEMP/poll-update.json"
      - name: Verify the complete feeds
        run: python3 automation/ingest_poll_update.py --check-only
      - name: Commit the atomic raw-data update
        if: >-
          github.event_name == 'workflow_dispatch' ||
          !startsWith(github.event.issue.title, '[poll-ingest-test] ')
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          test -n "$changed"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(data/raw-polls\.json|data/polls\.json)$' || true)"
          test -z "$unexpected"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/raw-polls.json data/polls.json
          update_date="$(python3 -c 'import json,os; print(json.load(open(os.environ["RUNNER_TEMP"] + "/poll-update.json")).get("updateDate", "verified-update"))')"
          git commit -m "polls: verified update ${update_date}"
          git push origin HEAD:main
      - name: Trigger the full gated recalculation
        if: >-
          github.event_name == 'workflow_dispatch' ||
          !startsWith(github.event.issue.title, '[poll-ingest-test] ')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run recalculate.yml --ref main
      - name: Close a successful issue request
        if: success() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          if [[ "$ISSUE_TITLE" == "[poll-ingest-test] "* ]]; then
            message="Payload validated successfully in test mode; no repository data was changed."
          else
            message="Verified payload ingested atomically and the full recalculation was dispatched."
          fi
          gh issue comment "$ISSUE_NUMBER" --body "$message"
          gh issue close "$ISSUE_NUMBER" --reason completed
      - name: Report a failed issue request
        if: failure() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: >-
          gh issue comment "$ISSUE_NUMBER"
          --body "Automated ingestion failed validation or execution. The issue remains open for audit; no release was declared successful."
