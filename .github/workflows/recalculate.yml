name: Recalculate and publish Observer

on:
  push:
    branches: [main]
    paths:
      - data/raw-polls.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: observer-production-release
  cancel-in-progress: false

jobs:
  recalculate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore the reviewed model source bundle
        run: |
          cat automation/model-source.tar.gz.part-* > /tmp/model-source.tar.gz
          mkdir model-source
          tar -xzf /tmp/model-source.tar.gz -C model-source --strip-components=1
          cp data/raw-polls.json model-source/incoming-raw-polls.json
      - name: Adopt new polls and execute the full gated pipeline
        working-directory: model-source
        run: python3 operations/auto_recalculate.py --incoming incoming-raw-polls.json --force
      - name: Prepare immutable public release branch
        shell: bash
        run: |
          set -euo pipefail
          release_id="$(python3 -c 'import json; print(json.load(open("model-source/operations/auto-update-state.json"))["release_id"])')"
          release_dir="model-source/staging/releases/${release_id}"
          test -f "${release_dir}/release-manifest.json"
          mkdir -p /tmp/observer-production
          cp -R "${release_dir}/." /tmp/observer-production/
          cd /tmp/observer-production
          git init
          git checkout -b production
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "release: ${release_id}"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin production
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Preserve diagnostics when validation fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: observer-update-failure
          path: |
            model-source/operations/auto-update-state.json
            model-source/staging/current.json
          if-no-files-found: ignore
